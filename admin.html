<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AtmBetSignal — Admin Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070a11;
      --card-bg: #0f172a;
      --border: #1e293b;
      --accent: #10b981;
      --cyan: #38bdf8;
      --gold: #f59e0b;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      padding: 30px 20px 80px;
    }
    .container { max-width: 950px; margin: 0 auto; }
    
    .login-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      max-width: 400px;
      margin: 80px auto;
      text-align: center;
    }
    .login-box input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #070a11;
      color: #fff;
      margin: 15px 0;
      text-align: center;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    .admin-panel { display: none; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }
    .section-title {
      font-size: 1.15rem;
      margin: 25px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pick-item {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 14px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
    }
    .badge-diamond { background: #38bdf8; color: #000; }
    .badge-gold { background: #f59e0b; color: #000; }
    .badge-official { background: var(--accent); color: #000; }
    .badge-radar { background: #334155; color: #cbd5e1; }
  </style>
</head>
<body>

  <div class="container">
    <div class="login-box" id="adminLogin">
      <h2>👑 Admin Login</h2>
      <input type="password" id="adminPass" placeholder="Password Admin">
      <button onclick="checkAdmin()">Entra</button>
    </div>

    <div class="admin-panel" id="adminPanel">
      <header>
        <div>
          <h2>👑 AtmBetSignal Admin Console</h2>
          <p style="color: var(--muted); font-size: 0.85rem;">Dati operativi completi: Ufficiali e Watchlist Radar</p>
        </div>
        <div>
          <a href="index.html" style="color: var(--muted); text-decoration: none; margin-right: 15px;">← Torna al Sito</a>
          <button onclick="logoutAdmin()" style="background: none; border: 1px solid var(--border); color: #fff; padding: 4px 10px; border-radius: 6px; cursor: pointer;">Esci</button>
        </div>
      </header>

      <div class="section-title">🎯 Selezioni Ufficiali Tracked (Probabilità ≥ 65%)</div>
      <div id="adminOfficials">Caricamento...</div>

      <div class="section-title" style="color: var(--muted);">📡 Watchlist Radar Top 10 (Studio & Monitoraggio)</div>
      <div id="adminRadar">Caricamento...</div>
    </div>
  </div>

  <script>
    function checkAdmin() {
      const pass = document.getElementById('adminPass').value;
      if (pass === 'AtmBet2026!') {
        sessionStorage.setItem('atm_admin_auth', 'true');
        showPanel();
      } else {
        alert('Password non corretta');
      }
    }

    function showPanel() {
      document.getElementById('adminLogin').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      loadAdminData();
    }

    function logoutAdmin() {
      sessionStorage.removeItem('atm_admin_auth');
      location.reload();
    }

    function loadAdminData() {
      fetch('data/latest.json?nocache=' + new Date().getTime())
        .then(r => r.json())
        .then(d => {
          // 1. UFFICIALI CON BADGE DINAMICO
          const officials = d.all_selected_picks || [];
          const offCont = document.getElementById('adminOfficials');
          if (officials.length === 0) {
            offCont.innerHTML = '<p style="color: var(--muted); padding: 12px; background: var(--card-bg); border-radius: 8px;">Nessuna selezione sopra il 65% per oggi. Capitale protetto.</p>';
          } else {
            let html = '';
            officials.forEach((p, i) => {
              const prob = ((p.estimated_probability || 0) * 100).toFixed(1);
              const edge = (((p.edge || 0)) * 100).toFixed(1);
              
              let badgeHtml = `<span class="badge badge-official">TOP PICK #${i+1}</span>`;
              let borderStyle = 'border: 1px solid var(--border);';

              if (p.tier === 'DIAMOND') {
                badgeHtml = `<span class="badge badge-diamond">💎 DIAMOND PICK</span>`;
                borderStyle = 'border: 1px solid #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);';
              } else if (p.tier === 'GOLD') {
                badgeHtml = `<span class="badge badge-gold">🥇 GOLD PICK</span>`;
                borderStyle = 'border: 1px solid #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.15);';
              }

              html += `
                <div class="pick-item" style="${borderStyle}">
                  <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                    ${badgeHtml}
                    <span style="color: var(--muted); font-size: 0.8rem;">${p.league || ''}</span>
                  </div>
                  <h3 style="margin-bottom: 4px; font-size: 1.1rem;">${p.match}</h3>
                  <p style="color: var(--accent); font-weight: 700; font-size: 0.95rem; margin-bottom: 6px;">🎯 Esito: ${p.outcome_label} @ ${Number(p.odd).toFixed(2)}</p>
                  <div style="font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--muted);">
                    Probabilità: ${prob}% | Stake Kelly: ${p.suggested_stake_pct}% | Edge: +${edge}%
                  </div>
                </div>
              `;
            });
            offCont.innerHTML = html;
          }

          // 2. RADAR
          const radar = d.radar_watchlist || [];
          const radCont = document.getElementById('adminRadar');
          if (radar.length === 0) {
            radCont.innerHTML = '<p style="color: var(--muted);">Nessun match nel radar.</p>';
          } else {
            let htmlR = '';
            radar.forEach((r, i) => {
              const prob = ((r.estimated_probability || 0) * 100).toFixed(1);
              htmlR += `
                <div class="pick-item" style="border: 1px solid var(--border);">
                  <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                    <span class="badge badge-radar">RADAR #${i+1}</span>
                    <span style="color: var(--muted); font-size: 0.8rem;">${r.league || ''}</span>
                  </div>
                  <h4 style="margin-bottom: 4px; font-size: 1rem;">${r.match}</h4>
                  <p style="color: #cbd5e1; font-size: 0.9rem; margin-bottom: 4px;">🎯 Esito: <b>${r.outcome_label}</b> @ <b>${Number(r.odd).toFixed(2)}</b></p>
                  <div style="font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--muted);">
                    Probabilità stimata: ${prob}% (Esclusivamente per Studio)
                  </div>
                </div>
              `;
            });
            radCont.innerHTML = htmlR;
          }
        });
    }

    if (sessionStorage.getItem('atm_admin_auth') === 'true') {
      showPanel();
    }
  </script>
</body>
</html>
