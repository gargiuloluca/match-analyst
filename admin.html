<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AtmBetSignal — Admin Master Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070a11;
      --card-bg: #0f172a;
      --border: #1e293b;
      --accent: #10b981;
      --gold: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      padding: 30px 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .login-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      max-width: 420px;
      margin: 100px auto;
      text-align: center;
    }
    .login-box input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #070a11;
      color: #fff;
      font-size: 1rem;
      margin: 20px 0;
      text-align: center;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      background: var(--gold);
      color: #000;
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }
    .admin-panel { display: none; }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      margin-bottom: 30px;
    }
    .pick-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .badge {
      background: var(--accent);
      color: #000;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- SCHERMATA LOGIN ADMIN -->
    <div class="login-box" id="loginBox">
      <h2>🔐 Accesso Riservato Admin</h2>
      <p style="color: var(--muted); font-size: 0.9rem; margin-top: 8px;">Inserisci la master key per sbloccare la console operativa.</p>
      <input type="password" id="adminPass" placeholder="Master Password" onkeydown="if(event.key==='Enter') checkAuth()">
      <button onclick="checkAuth()">Accedi alla Console</button>
      <p id="errText" style="color: #ef4444; font-size: 0.85rem; margin-top: 10px; display: none;">Password non valida.</p>
    </div>

    <!-- PANNELLO ADMIN (VISIBILE SOLO DOPO LOGIN) -->
    <div class="admin-panel" id="adminPanel">
      <div class="header-bar">
        <div>
          <h2>👑 AtmBetSignal Admin Console</h2>
          <p style="color: var(--muted); font-size: 0.9rem;">Dati operativi e segnali odierni decifrati in chiaro.</p>
        </div>
        <div>
          <a href="index.html" style="color: var(--muted); text-decoration: none; margin-right: 15px;">← Torna al Sito</a>
          <button onclick="logout()" style="background: none; border: 1px solid var(--border); color: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Esci</button>
        </div>
      </div>

      <div style="margin-bottom: 24px;">
        <h3 style="margin-bottom: 12px;">🎯 Top Picks di Oggi in Palinsesto</h3>
        <div id="picksContainer">Caricamento segnali in corso...</div>
      </div>
    </div>
  </div>

  <script>
    // CAMBIA QUI LA TUA PASSWORD DI ACCESSO ADMIN
    const MASTER_KEY = "221771";

    function checkAuth() {
      const val = document.getElementById('adminPass').value;
      if (val === MASTER_KEY) {
        sessionStorage.setItem('atm_admin_auth', 'true');
        showPanel();
      } else {
        document.getElementById('errText').style.display = 'block';
      }
    }

    function showPanel() {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      loadPicks();
    }

    function logout() {
      sessionStorage.removeItem('atm_admin_auth');
      location.reload();
    }

    function loadPicks() {
      fetch('data/latest.json')
        .then(r => r.json())
        .then(d => {
          const list = d.all_selected_picks || [];
          const cont = document.getElementById('picksContainer');
          if (list.length === 0) {
            cont.innerHTML = '<p style="color: var(--muted);">Nessuna partita ha superato la soglia del 65% oggi.</p>';
            return;
          }
          let html = '';
          list.forEach((p, i) => {
            html += `
              <div class="pick-item">
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                  <span class="badge">TOP PICK #${i+1}</span>
                  <span style="color: var(--muted); font-size: 0.85rem;">${p.league}</span>
                </div>
                <h3 style="margin-bottom: 6px;">${p.match}</h3>
                <p style="color: var(--accent); font-weight: 700; margin-bottom: 8px;">🎯 Giocata: ${p.outcome_label} @ ${p.odd.toFixed(2)}</p>
                <div style="font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--muted);">
                  Probabilità: ${(p.estimated_probability * 100).toFixed(1)}% | Stake Kelly: ${p.suggested_stake_pct}%
                </div>
              </div>
            `;
          });
          cont.innerHTML = html;
        })
        .catch(e => {
          document.getElementById('picksContainer').innerHTML = '<p>Errore nel caricamento dei dati di oggi.</p>';
        });
    }

    // Auto-login se già autenticato nella sessione
    if (sessionStorage.getItem('atm_admin_auth') === 'true') {
      showPanel();
    }
  </script>
</body>
</html>
