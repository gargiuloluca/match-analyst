name: AtmBetSignal Daily Unified Engine

on:
  schedule:
    # Esecuzione automatica ogni mattina alle 08:30 UTC (09:30 ora italiana)
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      action_note:
        description: 'Nota di avvio manuale'
        required: false
        default: 'Avvio manuale unificato'

permissions:
  contents: write

jobs:
  run-unified-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # FASE 1: Refertazione esiti precedenti e aggiornamento Equity Line Ufficiale
      - name: Settle previous results and manage subscribers
        run: |
          python scripts/settle_results.py
          if [ -f scripts/manage_subscribers.py ]; then python scripts/manage_subscribers.py; fi
        env:
          ODDSAPI_KEY: ${{ secrets.ODDSAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # FASE 2: Scaricamento quote fresche di giornata (con Multi-Key Fallback)
      - name: Fetch daily fixtures
        run: python scripts/fetch_fixtures.py
        env:
          ODDSAPI_KEY: ${{ secrets.ODDSAPI_KEY }}

      # FASE 3A: Motore Ufficiale A (Dixon-Coles Matematico Standard)
      - name: Run official quantitative analysis (Model A)
        run: python scripts/analyze.py

      # FASE 3B: Motore Sperimentale B (Dixon-Coles + Rolling xG)
      - name: Run experimental xG analysis (Model B)
        run: python scripts/analyze_xg.py

      # FASE 4: Invio selezioni ufficiali su Telegram
      - name: Send new signals to Telegram
        run: python scripts/send_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # FASE 5: Salvataggio automatico di tutti i file dati (Ufficiali e Sperimentali)
      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: official & experimental xG data [skip ci]" && git pull --rebase origin main && git push origin main)
