name: AtmBetSignal Daily Unified Engine

on:
  workflow_dispatch:
    inputs:
      task_mode:
        description: 'Seleziona operazione da eseguire'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - analyze_only
          - settle_only
      action_note:
        description: 'Nota operativa'
        required: false
        default: 'Trigger da Console Admin'

permissions:
  contents: write

jobs:
  run-unified-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # FASE 1: Refertazione esiti (eseguita se 'all' o 'settle_only')
      - name: Settle previous results and manage subscribers
        if: ${{ github.event.inputs.task_mode == 'all' || github.event.inputs.task_mode == 'settle_only' }}
        run: |
          python scripts/settle_results.py
          if [ -f scripts/manage_subscribers.py ]; then python scripts/manage_subscribers.py; fi
        env:
          ODDSAPI_KEY: ${{ secrets.ODDSAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # FASE 2: Scaricamento quote fresche (eseguita se 'all' o 'analyze_only')
      - name: Fetch daily fixtures
        if: ${{ github.event.inputs.task_mode == 'all' || github.event.inputs.task_mode == 'analyze_only' }}
        run: python scripts/fetch_fixtures.py
        env:
          ODDSAPI_KEY: ${{ secrets.ODDSAPI_KEY }}

      # FASE 3A: Motore Ufficiale A (Dixon-Coles Standard)
      - name: Run official quantitative analysis (Model A)
        if: ${{ github.event.inputs.task_mode == 'all' || github.event.inputs.task_mode == 'analyze_only' }}
        run: python scripts/analyze.py

      # FASE 3B: Motore Sperimentale B (Dixon-Coles + Rolling xG)
      - name: Run experimental xG analysis (Model B)
        if: ${{ github.event.inputs.task_mode == 'all' || github.event.inputs.task_mode == 'analyze_only' }}
        run: python scripts/analyze_xg.py

      # FASE 4: Invio selezioni ufficiali su Telegram
      - name: Send new signals to Telegram
        if: ${{ github.event.inputs.task_mode == 'all' || github.event.inputs.task_mode == 'analyze_only' }}
        run: python scripts/send_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # FASE 5: Salvataggio automatico di tutti i file dati
      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update via Admin Console [skip ci]" && git pull --rebase origin main && git push origin main)
          
