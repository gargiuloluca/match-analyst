name: Daily Analysis & Settlement

on:
  schedule:
    # Mattina: 09:47 UTC (circa 10:47 ora italiana) -> Quote assestate e mercati aperti
    - cron: '47 9 * * *'
    # Notte: 22:47 UTC (circa 23:47 ora italiana) -> Posticipi conclusi e refertazione completa
    - cron: '47 22 * * *'
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Seleziona operazione manuale'
        required: true
        default: 'morning_picks'
        type: choice
        options:
          - 'morning_picks'
          - 'night_settlement'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ==========================================
      # OPERAZIONI DEL MATTINO (Pronostici)
      # ==========================================
      - name: Fetch fixtures and odds (Morning)
        if: github.event.schedule == '47 9 * * *' || github.event.inputs.job_type == 'morning_picks'
        env:
          ODDSAPI_KEY: ${{ secrets.ODDSAPI_KEY }}
        run: python scripts/fetch_fixtures.py

      - name: Run analysis and generate picks (Morning)
        if: github.event.schedule == '47 9 * * *' || github.event.inputs.job_type == 'morning_picks'
        run: python scripts/analyze.py

      - name: Send Telegram Picks (Morning)
        if: github.event.schedule == '47 9 * * *' || github.event.inputs.job_type == 'morning_picks'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_telegram.py

      # ==========================================
      # OPERAZIONI DELLA NOTTE (Riepilogo & Gestione Abbonati)
      # ==========================================
      - name: Settle finished bets & Manage Subscribers
        if: github.event.schedule == '47 22 * * *' || github.event.inputs.job_type == 'night_settlement'
        env:
          ODDSAPI_KEY: ${{ secrets.ODDSAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/settle_results.py
          python scripts/manage_subscribers.py

      # ==========================================
      # SALVATAGGIO DEI DATI SU GITHUB
      # ==========================================
      - name: Commit updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update [skip ci]" && git pull --rebase origin main && git push origin main)
